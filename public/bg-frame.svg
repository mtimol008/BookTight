<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#E8A93A" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- corner crosshairs -->
  <g stroke="#E8A93A" stroke-width="1" opacity="0.4">
    <g transform="translate(34,34)">
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
    </g>
    <g transform="translate(396,34)">
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
    </g>
  </g>
  <g stroke="#3D8C7F" stroke-width="1" opacity="0.35">
    <g transform="translate(34,898)">
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
    </g>
    <g transform="translate(396,898)">
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
    </g>
  </g>

  <!-- scale ruler -->
  <g opacity="0.32">
    <line x1="34" y1="466" x2="146" y2="466" stroke="#3D8C7F" stroke-width="1"/>
    <line x1="34" y1="461" x2="34" y2="471" stroke="#3D8C7F" stroke-width="1"/>
    <line x1="146" y1="461" x2="146" y2="471" stroke="#3D8C7F" stroke-width="1"/>
  </g>

  <!-- compass -->
  <g transform="translate(52,820)" opacity="0.34">
    <circle cx="0" cy="0" r="17" fill="none" stroke="#1B1F24" stroke-width="0.8"/>
    <line x1="0" y1="-13" x2="0" y2="13" stroke="#E8A93A" stroke-width="1.2"/>
    <path d="M 0 -13 L -4 -2 L 4 -2 Z" fill="#E8A93A"/>
    <text x="0" y="-22" font-family="monospace" font-size="8" fill="#1B1F24" text-anchor="middle" opacity="0.7">N</text>
  </g>

  <!-- hatched swatch, bottom right -->
  <rect x="332" y="790" width="64" height="64" fill="none" stroke="#B9AF98" stroke-width="0.8" opacity="0.4"/>
  <rect x="332" y="790" width="64" height="64" fill="url(#hatch)"/>
</svg>
